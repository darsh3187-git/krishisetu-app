name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Add Camera Permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KrishiSetu-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
